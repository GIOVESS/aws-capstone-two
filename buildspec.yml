version: 0.2

env:
  variables:
    CONTAINER_NAME: myapp-container

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - cd src && npm ci && cd ..
  pre_build:
    commands:
      - echo Running unit tests...
      - cd src && npm test && cd ..
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME
      - IMAGE_TAG=$(echo ${CODEBUILD_RESOLVED_SOURCE_VERSION:-local} | cut -c 1-7)-$CODEBUILD_BUILD_NUMBER
  build:
    commands:
      - echo Build started on `date`
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:latest .
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Writing deployment artifacts...
      - printf '{"ImageURI":"%s"}' $REPOSITORY_URI:$IMAGE_TAG > imageDetail.json
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - sed -i "s/<account_id>/$AWS_ACCOUNT_ID/g" taskdef.json
      - cat imageDetail.json

artifacts:
  files:
    - imageDetail.json
    - imagedefinitions.json
    - appspec.yml
    - taskdef.json
